<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Informations</title>
    <link rel="icon" type="image/png" href="aaa.png">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f8f9fa;
    }
    .account-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .form-control {
      background-color: #eee;
      border: 1px solid transparent;
      border-radius: 0;
      padding: 0.75rem 1rem;
    }
    .form-control:focus {
      background-color: #fff;
      border-color: #000;
      box-shadow: none;
    }
    .form-label {
      font-size: 0.85rem;
      color: #6c757d;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

 <header class="vb-entete">
  <div class="vb-entete-in">
    <a href="/site.html" class="vb-retour" aria-label="Retour">
      <span class="vb-fleche">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </span>
      <span class="vb-retour-txt">Retour</span>
    </a>
    <a href="/" class="vb-marque">Veraba</a>
  </div>
</header>
<style>
  .vb-entete { position: sticky; top: 0; z-index: 1000; background: #0b0b0b; border-bottom: 3px solid #0f3d2e; }
  .vb-entete-in { position: relative; max-width: 1140px; margin: 0 auto; height: 64px; padding: 0 20px; display: flex; align-items: center; }
  .vb-retour { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-size: .82rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .vb-fleche { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s, transform .2s; }
  .vb-retour:hover { color: #fff; }
  .vb-retour:hover .vb-fleche { background: #0f3d2e; border-color: #0f3d2e; transform: translateX(-3px); }
  .vb-marque { position: absolute; left: 50%; transform: translateX(-50%); color: #fff; text-decoration: none; font-weight: 900; font-size: 1.05rem; letter-spacing: 4px; text-transform: uppercase; }
  .vb-marque:hover { color: #7fc8a9; }
  @media (max-width: 576px) { .vb-entete-in { height: 56px; padding: 0 14px; } .vb-retour-txt { display: none; } }
</style>


  <div class="container py-5 account-container">
    <h2 class="fw-bold text-uppercase mb-4" style="letter-spacing: 1px; font-size: 1.5rem;">Informations personnelles</h2>
    
    <div class="card border-0 shadow-sm rounded-0 p-4 p-md-5" style="background-color: #fff;">
      <form id="profileForm">
        
        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <label class="form-label">Prénom</label>
            <input type="text" id="inputPrenom" class="form-control" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input type="text" id="inputNom" class="form-control" readonly>
          </div>
        </div>
        
        <div class="mb-4">
          <label class="form-label">Adresse e-mail</label>
          <input type="email" id="inputEmail" class="form-control" readonly>
        </div>

        <div class="mb-4">
          <label class="form-label">Date de naissance (JJ/MM/AAAA)</label>
          <input type="text" id="inputDateNaissance" class="form-control" readonly placeholder="Non renseignée">
        </div>

        <!-- Le mot de passe n'est jamais affiché en clair pour des raisons de sécurité -->
        <div class="mb-5">
          <label class="form-label">Mot de passe</label>
          <div class="d-flex align-items-center">
            <input type="password" class="form-control me-3" value="********" readonly>
            <a href="/" class="btn btn-outline-dark rounded-0 px-3 text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px;">Modifier</a>
          </div>
        </div>

        <div class="text-end">
          <button type="button" id="btnEdit" class="btn btn-dark rounded-0 px-4 py-3 text-uppercase fw-bold text-white w-100" style="font-size: 0.85rem; letter-spacing: 1px;">
            Mettre à jour mes informations
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    // Dès que la page s'ouvre, on va chercher les données du client
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('/user/me');
        const data = await response.json();

        if (data.success) {
          // On remplit les champs HTML avec les données de la base de données
          document.getElementById('inputPrenom').value = data.user.prenom || '';
          document.getElementById('inputNom').value = data.user.nom || '';
          document.getElementById('inputEmail').value = data.user.email || '';
          
          // Formatage de la date de naissance si elle existe
          if(data.user.jour_naissance && data.user.mois_naissance && data.user.annee_naissance) {
             const jour = String(data.user.jour_naissance).padStart(2, '0');
             const mois = String(data.user.mois_naissance).padStart(2, '0');
             const annee = data.user.annee_naissance;
             document.getElementById('inputDateNaissance').value = `${jour}/${mois}/${annee}`;
          }
        } else {
          // Si l'utilisateur n'est pas connecté, on le renvoie vers la page de login
          window.location.href = '/login.html';
        }
      } catch (error) {
        console.error("Erreur lors de la récupération des données :", error);
      }
    });
  </script>
</body>
</html>
